<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <style>
      .title{font:700 34px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#3b2f2f}
      .subtitle{font:500 18px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#6b5b53}
      .section{font:700 24px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5a4335}
      .label{font:600 19px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#43322b}
      .text{font:500 17px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#5a4a42}
      .small{font:500 15px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#7a6a63}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf7f54"/>
    </marker>
  </defs>
  <rect width="1600" height="940" rx="28" fill="#fff8f2"/>
  <text x="60" y="70" class="title">Dynamic Feature Baseline Profile 落地总览</text>
  <text x="60" y="104" class="subtitle">主题：让 DF 也能在安装期 / 下一次 dexopt 中吃到 profile-guided AOT</text>

  <rect x="60" y="150" width="470" height="300" rx="24" fill="#fff0e3" stroke="#f2b487" stroke-width="2"/>
  <text x="90" y="196" class="section">一、官方已有路径（只覆盖 base）</text>
  <rect x="90" y="225" width="410" height="78" rx="16" fill="#ffffff" stroke="#f2c6a6"/>
  <text x="112" y="255" class="label">A 路径：Play 下发 .dm</text>
  <text x="112" y="282" class="text">安装期直接进 ref/，dex2oat 立即走 speed-profile</text>
  <rect x="90" y="322" width="410" height="96" rx="16" fill="#ffffff" stroke="#f2c6a6"/>
  <text x="112" y="352" class="label">B 路径：assets/dexopt/ + ProfileInstaller</text>
  <text x="112" y="379" class="text">首启读取 010 + .profm，先写 cur/，等待下次 dexopt</text>
  <text x="112" y="404" class="small">结论：base 能用；DF 默认接不上</text>

  <rect x="565" y="150" width="470" height="300" rx="24" fill="#fff4d8" stroke="#e7c25e" stroke-width="2"/>
  <text x="595" y="196" class="section">二、问题根因（DF 长期跑不满）</text>
  <rect x="595" y="225" width="410" height="193" rx="16" fill="#ffffff" stroke="#edd690"/>
  <text x="617" y="257" class="label">Play / AGP 只给 base 产 profile</text>
  <text x="617" y="286" class="text">原生 ProfileInstaller 只处理 primary.prof</text>
  <text x="617" y="315" class="text">DF 只能靠运行时 JIT + Profile Saver 慢慢攒热点</text>
  <text x="617" y="344" class="text">用户先用、再等后台 dexopt，首轮体验最差</text>
  <text x="617" y="381" class="small">文中示例：df_edit_filter 约 20MB+ dex，没 profile 时长期处于 verify / run-from-apk</text>

  <rect x="1070" y="150" width="470" height="300" rx="24" fill="#eaf7e8" stroke="#99c995" stroke-width="2"/>
  <text x="1100" y="196" class="section">三、核心解法（按系统版本分流）</text>
  <rect x="1100" y="225" width="410" height="78" rx="16" fill="#ffffff" stroke="#b8dcb4"/>
  <text x="1122" y="255" class="label">Android 14 QPR2+</text>
  <text x="1122" y="282" class="text">把 015 profile 写入 assets/art-profile/baseline.prof</text>
  <rect x="1100" y="322" width="410" height="96" rx="16" fill="#ffffff" stroke="#b8dcb4"/>
  <text x="1122" y="352" class="label">Android 12–13</text>
  <text x="1122" y="379" class="text">自定义 Installer 复制同一份 015 到 cur/&lt;split&gt;.split.prof</text>
  <text x="1122" y="404" class="small">9–11 需额外独立生成 010 + .profm 兜底</text>

  <line x1="530" y1="300" x2="565" y2="300" stroke="#cf7f54" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1035" y1="300" x2="1070" y2="300" stroke="#cf7f54" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="60" y="500" width="1480" height="220" rx="24" fill="#ffffff" stroke="#e5d3c8" stroke-width="2"/>
  <text x="90" y="546" class="section">四、构建期插件流水线</text>
  <rect x="95" y="578" width="185" height="98" rx="18" fill="#fff0e3" stroke="#f2b487"/>
  <text x="117" y="611" class="label">① 采集</text>
  <text x="117" y="639" class="text">真机跑核心场景</text>
  <text x="117" y="664" class="small">pm dump-profiles + snapshot-profile</text>
  <rect x="320" y="578" width="185" height="98" rx="18" fill="#fff4d8" stroke="#e7c25e"/>
  <text x="342" y="611" class="label">② 转换</text>
  <text x="342" y="639" class="text">二进制 Profile → HRP</text>
  <text x="342" y="664" class="small">CRC32 校验 + 反混淆，可进版本控制</text>
  <rect x="545" y="578" width="185" height="98" rx="18" fill="#eaf7e8" stroke="#99c995"/>
  <text x="567" y="611" class="label">③ 编译</text>
  <text x="567" y="639" class="text">HRP + 本次 dex + mapping</text>
  <text x="567" y="664" class="small">产出 015 profile</text>
  <rect x="770" y="578" width="185" height="98" rx="18" fill="#eef3ff" stroke="#9bb2f0"/>
  <text x="792" y="611" class="label">④ 校验</text>
  <text x="792" y="639" class="text">C1–C5 硬约束</text>
  <text x="792" y="664" class="small">路径 / 格式 / 计数 / key / checksum</text>
  <rect x="995" y="578" width="185" height="98" rx="18" fill="#f7ebff" stroke="#c7a5ec"/>
  <text x="1017" y="611" class="label">⑤ 注入</text>
  <text x="1017" y="639" class="text">写回 AAB 解包目录</text>
  <text x="1017" y="664" class="small">&lt;module&gt;/assets/art-profile/baseline.prof</text>
  <rect x="1220" y="578" width="285" height="98" rx="18" fill="#f0faf8" stroke="#8ed1c0"/>
  <text x="1242" y="611" class="label">⑥ 下发与生效</text>
  <text x="1242" y="639" class="text">Play 切 split APK；安装期命中 embedded profile</text>
  <text x="1242" y="664" class="small">ART Service → profman copy-and-update-profile-key → dex2oat</text>
  <line x1="280" y1="627" x2="320" y2="627" stroke="#cf7f54" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="505" y1="627" x2="545" y2="627" stroke="#cf7f54" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="730" y1="627" x2="770" y2="627" stroke="#cf7f54" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="955" y1="627" x2="995" y2="627" stroke="#cf7f54" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1180" y1="627" x2="1220" y2="627" stroke="#cf7f54" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="760" width="1480" height="130" rx="24" fill="#fff7f0" stroke="#e8c8b3" stroke-width="2"/>
  <text x="90" y="806" class="section">五、收益结论</text>
  <text x="90" y="842" class="text">verify → speed-profile 后，文中 DF 模块 odex 从 416KB 增到 6,289KB，并新增 1,209KB 的 .art；整包冷启动均值从 318.10ms 降到 265.00ms。</text>
  <text x="90" y="872" class="text">继续把编译强度拉到全量 speed 虽然产物膨胀到 148.12MB，但冷启动反而回退到 323.25ms，说明“编得准”比“编得多”更重要。</text>
</svg>