<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title{font:700 28px Arial,Helvetica,sans-serif;fill:#111827}.h{font:700 20px Arial,Helvetica,sans-serif;fill:#111827}.t{font:16px Arial,Helvetica,sans-serif;fill:#374151}.s{font:14px Arial,Helvetica,sans-serif;fill:#4b5563}.box{rx:18;stroke:#d1d5db;stroke-width:2;fill:#fff}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.yellow{fill:#fffbeb;stroke:#fbbf24}.red{fill:#fef2f2;stroke:#f87171}.gray{fill:#f9fafb;stroke:#9ca3af}.line{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="50" y="55" class="title">弹幕 SDK KMP 改造核心架构</text>
  <text x="50" y="88" class="t">commonMain 负责稳定业务模型与渲染逻辑，平台侧通过 SPI / expect-actual / FFI 提供差异能力。</text>

  <rect x="80" y="130" width="1040" height="170" class="box blue"/>
  <text x="110" y="165" class="h">KMP commonMain</text>
  <text x="110" y="198" class="t">弹幕数据模型 · 排版策略 · Compose UI · Klay VM · Repository</text>
  <text x="110" y="228" class="s">只定义接口与可复用逻辑，不直接依赖 Android / ArkTS 原生实现</text>
  <rect x="640" y="170" width="420" height="88" rx="14" fill="#ffffff" stroke="#93c5fd"/>
  <text x="670" y="202" class="t">导出边界：@KotlinExport / @ArkTsExportComposable</text>
  <text x="670" y="232" class="s">参数聚合、类型约束、线程约束需在边界层处理</text>

  <rect x="80" y="400" width="470" height="190" class="box green"/>
  <text x="110" y="435" class="h">Android Host</text>
  <text x="110" y="468" class="t">JVM 字节码 · Jetpack Compose · 原生服务实现</text>
  <text x="110" y="500" class="s">@KmpSpiImpl 注入表情、日志、路由、埋点等能力</text>
  <text x="110" y="530" class="s">expect/actual 可直接复用 Android SDK 类型与能力</text>

  <rect x="650" y="400" width="470" height="190" class="box yellow"/>
  <text x="680" y="435" class="h">Harmony Host / ArkTS</text>
  <text x="680" y="468" class="t">Kotlin/Native .so · .har · ArkTS FFI · CAPI 渲染</text>
  <text x="680" y="500" class="s">instanceOf&lt;SPI接口名&gt; 命名导出实现</text>
  <text x="680" y="530" class="s">非 suspend FFI / SPI 方法主线程调用，生命周期结束需 release</text>

  <path d="M310 300 C310 340 310 360 310 398" class="line"/>
  <path d="M900 300 C900 340 900 360 900 398" class="line"/>
  <path d="M550 490 C590 490 610 490 648 490" class="line"/>
  <text x="560" y="470" class="s">跨语言边界</text>

  <rect x="270" y="620" width="660" height="58" rx="16" fill="#fef2f2" stroke="#f87171"/>
  <text x="300" y="655" class="t">风险控制：线程边界、导出类型、资源命名、双向引用、构建分支对齐</text>
</svg>
