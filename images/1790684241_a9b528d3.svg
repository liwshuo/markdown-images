<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#475569" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#0f172a">直播电商性能优化：核心链路与治理抓手</text>
  <text x="60" y="112" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#475569">从进房、入口/讲解卡、商列到商详，围绕“资源抢占 + 实时刷新 + 转化链路”做体验优化</text>

  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#0f172a" filter="url(#shadow)">
    <rect x="60" y="170" width="190" height="88" rx="20" fill="#ffffff"/>
    <text x="105" y="222">进入直播间</text>
    <rect x="310" y="170" width="190" height="88" rx="20" fill="#ffffff"/>
    <text x="347" y="222">小黄车入口</text>
    <rect x="560" y="170" width="190" height="88" rx="20" fill="#ffffff"/>
    <text x="606" y="222">讲解卡</text>
    <rect x="810" y="170" width="190" height="88" rx="20" fill="#ffffff"/>
    <text x="858" y="222">商品列表</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="250" y1="214" x2="310" y2="214"/>
    <line x1="500" y1="214" x2="560" y2="214"/>
    <line x1="750" y1="214" x2="810" y2="214"/>
  </g>

  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#0f172a">
    <rect x="75" y="330" width="250" height="220" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="105" y="372" font-size="24" font-weight="700">链路前置</text>
    <text x="105" y="415" font-size="18">• P1 组件提升为 P0</text>
    <text x="105" y="450" font-size="18">• 轻量进房接口</text>
    <text x="105" y="485" font-size="18">• 预览流直出入口</text>

    <rect x="360" y="330" width="250" height="220" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="390" y="372" font-size="24" font-weight="700">资源降载</text>
    <text x="390" y="415" font-size="18">• 半/全清屏模式</text>
    <text x="390" y="450" font-size="18">• 遮挡组件暂停</text>
    <text x="390" y="485" font-size="18">• 小窗播放器复用</text>

    <rect x="645" y="330" width="250" height="220" rx="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="675" y="372" font-size="24" font-weight="700">数据提速</text>
    <text x="675" y="415" font-size="18">• 商列缓存 + 静默刷新</text>
    <text x="675" y="450" font-size="18">• 端智能预加载</text>
    <text x="675" y="485" font-size="18">• 预加载专用接口</text>

    <rect x="930" y="330" width="210" height="220" rx="22" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="960" y="372" font-size="24" font-weight="700">帧调度</text>
    <text x="960" y="415" font-size="18">• 减少线程切换</text>
    <text x="960" y="450" font-size="18">• doFrame 提前</text>
    <text x="960" y="485" font-size="18">• 队列屏障治理</text>
  </g>

  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#334155">
    <text x="80" y="635" font-size="19">核心收益参考：讲解卡 P90 -55% 级、商列首屏 Android 均值 -12% 级、滑动 FPS +2.7% 级，且可带动消费/成交过程指标。</text>
  </g>
</svg>
