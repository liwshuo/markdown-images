<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .title{font:700 28px Arial,Helvetica,sans-serif;fill:#111827}.h{font:700 19px Arial,Helvetica,sans-serif;fill:#111827}.t{font:15px Arial,Helvetica,sans-serif;fill:#374151}.s{font:13px Arial,Helvetica,sans-serif;fill:#4b5563}.stage{rx:18;stroke:#d1d5db;stroke-width:2;fill:#fff}.risk{fill:#fff7ed;stroke:#fb923c}.ok{fill:#ecfdf5;stroke:#34d399}.blue{fill:#eff6ff;stroke:#60a5fa}.line{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="50" y="55" class="title">KMP 弹幕模块落地路径与校验点</text>
  <text x="50" y="88" class="t">按“接口抽象 → 平台实现 → UI 迁移 → 稳定性兜底 → 工具链校验”的顺序推进，避免跨端一次性重写。</text>

  <rect x="70" y="150" width="190" height="135" class="stage blue"/>
  <text x="95" y="185" class="h">1. 边界识别</text>
  <text x="95" y="218" class="t">拆出可复用逻辑</text>
  <text x="95" y="248" class="s">数据模型 / 排版 / 配置</text>

  <rect x="300" y="150" width="190" height="135" class="stage blue"/>
  <text x="325" y="185" class="h">2. 能力抽象</text>
  <text x="325" y="218" class="t">SPI 与 expect/actual</text>
  <text x="325" y="248" class="s">宿主能力最小暴露</text>

  <rect x="530" y="150" width="190" height="135" class="stage blue"/>
  <text x="555" y="185" class="h">3. UI 迁移</text>
  <text x="555" y="218" class="t">Compose + Klay</text>
  <text x="555" y="248" class="s">状态提升 / 单向数据流</text>

  <rect x="760" y="150" width="190" height="135" class="stage risk"/>
  <text x="785" y="185" class="h">4. 风险治理</text>
  <text x="785" y="218" class="t">线程 / GC / 导出类型</text>
  <text x="785" y="248" class="s">release 斩断引用链</text>

  <rect x="990" y="150" width="150" height="135" class="stage ok"/>
  <text x="1015" y="185" class="h">5. 发布校验</text>
  <text x="1015" y="218" class="t">构建与分支</text>
  <text x="1015" y="248" class="s">RemoteX Clean</text>

  <path d="M260 218 L298 218" class="line"/><path d="M490 218 L528 218" class="line"/><path d="M720 218 L758 218" class="line"/><path d="M950 218 L988 218" class="line"/>

  <rect x="90" y="370" width="300" height="185" class="stage risk"/>
  <text x="120" y="405" class="h">稳定性检查</text>
  <text x="120" y="438" class="t">· 非 suspend FFI/SPI 不在子线程直调</text>
  <text x="120" y="468" class="t">· KMP ↔ ArkTS 双向引用退出时置空</text>
  <text x="120" y="498" class="t">· 导出父类返回子类属性不丢失</text>
  <text x="120" y="528" class="t">· 默认参数在 ArkTS 侧显式补齐</text>

  <rect x="450" y="370" width="300" height="185" class="stage ok"/>
  <text x="480" y="405" class="h">体验检查</text>
  <text x="480" y="438" class="t">· 弹幕列表数据更新后 UI 必须刷新</text>
  <text x="480" y="468" class="t">· Modifier 顺序符合视觉预期</text>
  <text x="480" y="498" class="t">· Compose UI Dump 可定位视图节点</text>
  <text x="480" y="528" class="t">· 资源命名不污染宿主资源</text>

  <rect x="810" y="370" width="300" height="185" class="stage blue"/>
  <text x="840" y="405" class="h">工程检查</text>
  <text x="840" y="438" class="t">· build.yaml 引入 SPI 依赖</text>
  <text x="840" y="468" class="t">· entry runtimeOnly 声明实现模块</text>
  <text x="840" y="498" class="t">· 多仓分支与 KMP 版本锁定</text>
  <text x="840" y="528" class="t">· 序列化插件与模型注解齐全</text>
</svg>
